name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build addon package
        run: |
          mkdir -p "package/!AnniversaryApiCompat"
          cp "!AnniversaryApiCompat.toc" "package/!AnniversaryApiCompat/"
          cp "Compat.lua" "package/!AnniversaryApiCompat/"
          cd package
          zip -r "../AnniversaryApiCompat.zip" "!AnniversaryApiCompat"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: "AnniversaryApiCompat"
          path: "./AnniversaryApiCompat.zip"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "./AnniversaryApiCompat.zip"
